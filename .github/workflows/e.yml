name: Update M3U

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - convert.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-m3u
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Fetch TXT and convert
        env:
          TXT_URL: ${{ secrets.TXT_URL }}
        run: python convert.py
      - name: Commit changed playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.m3u
          if git diff --cached --quiet; then
            echo "Playlist unchanged"
          else
            git commit -m "Update M3U playlist"
            git push
          fi
